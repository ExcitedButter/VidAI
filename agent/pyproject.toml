[project]
name = "vidai"
version = "0.1.0"
description = "MasSurge MVP creative pipeline: product URL -> audience -> selling angle -> talking-head script (QC + repair) -> character casting -> shot plan -> Seedance clips (QC + repair) -> assembled video."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vidai = "vidai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vidai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
